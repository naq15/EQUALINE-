    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); 
            color: #1e293b; 
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);

            background-color: #f1f5f9; 
            border: 1px solid #cbd5e1; 
            color: #0f172a; 
            border-radius: 0.5rem; 
            padding: 0.6rem;

        .input-box:focus { 
            border-color: #3b82f6; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: #ffffff;
        }
        /* Custom Scrollbar for Card Content */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="max-w-5xl w-full text-center mb-10 mt-4">
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 tracking-wider mb-2 drop-shadow-sm">
            EQUALINE
        </h1>
        <p class="text-gray-600 text-lg font-medium tracking-wide">Kalkulator Sistem Persamaan Linear Dua Variabel</p>
        <div class="h-1 w-32 bg-gradient-to-r from-blue-500 to-indigo-500 mx-auto mt-4 rounded-full shadow-[0_0_10px_rgba(59,130,246,0.3)]"></div>
    </div>

    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="glass-panel p-6 rounded-2xl shadow-lg transition transform hover:-translate-y-1 duration-300">
            <h2 class="text-xl font-bold mb-5 flex items-center text-blue-600">
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center mr-3 text-blue-700">1</div>
                Persamaan 1
            </h2>
            <div class="space-y-4">
                <div><label class="text-sm text-gray-600 font-semibold">Koefisien x</label><input type="number" id="a1" value="2" class="input-box mt-1 font-medium"></div>
                <div><label class="text-sm text-gray-600 font-semibold">Koefisien y</label><input type="number" id="b1" value="3" class="input-box mt-1 font-medium"></div>
                <div><label class="text-sm text-gray-600 font-semibold">Konstanta</label><input type="number" id="c1" value="12" class="input-box mt-1 font-medium"></div>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-2xl shadow-lg transition transform hover:-translate-y-1 duration-300">
            <h2 class="text-xl font-bold mb-5 flex items-center text-rose-600">
                <div class="w-8 h-8 rounded-full bg-rose-100 flex items-center justify-center mr-3 text-rose-700">2</div>
                Persamaan 2
            </h2>
            <div class="space-y-4">
                <div><label class="text-sm text-gray-600 font-semibold">Koefisien x</label><input type="number" id="a2" value="1" class="input-box mt-1 font-medium"></div>
                <div><label class="text-sm text-gray-600 font-semibold">Koefisien y</label><input type="number" id="b2" value="-1" class="input-box mt-1 font-medium"></div>
                <div><label class="text-sm text-gray-600 font-semibold">Konstanta</label><input type="number" id="c2" value="1" class="input-box mt-1 font-medium"></div>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-2xl shadow-lg flex flex-col justify-center border-t-4 border-t-indigo-500">
            <label class="text-sm text-gray-700 font-bold mb-3">Pilih Metode Penyelesaian:</label>
            
            <div class="grid grid-cols-2 gap-3 mb-6">
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="1" class="peer hidden">
                    <div class="peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-700 bg-white border border-gray-200 text-gray-500 rounded-xl p-3 text-center transition-all hover:bg-gray-50 shadow-sm">
                        <div class="font-semibold text-sm">Substitusi</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="2" class="peer hidden">
                    <div class="peer-checked:bg-rose-50 peer-checked:border-rose-500 peer-checked:text-rose-700 bg-white border border-gray-200 text-gray-500 rounded-xl p-3 text-center transition-all hover:bg-gray-50 shadow-sm">
                        <div class="font-semibold text-sm">Eliminasi</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="3" class="peer hidden">
                    <div class="peer-checked:bg-purple-50 peer-checked:border-purple-500 peer-checked:text-purple-700 bg-white border border-gray-200 text-gray-500 rounded-xl p-3 text-center transition-all hover:bg-gray-50 shadow-sm">
                        <div class="font-semibold text-sm">Campuran</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="4" class="peer hidden" checked>
                    <div class="peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-700 bg-white border border-gray-200 text-gray-500 rounded-xl p-3 text-center transition-all hover:bg-gray-50 shadow-sm">
                        <div class="font-semibold text-sm">Grafik</div>
                    </div>
                </label>
            </div>
            
            <button onclick="jalankanKalkulator()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-[0_4px_14px_0_rgba(79,70,229,0.39)] transition-all transform hover:scale-[1.02] active:scale-95">
                Hitung Solusi! <i class="fas fa-rocket ml-2"></i>
            </button>
        </div>
    </div>

    <div id="hasil-container" class="max-w-6xl w-full mt-10 hidden flex-col lg:flex-row gap-6 animate-fade-in">
        
        <div id="step-container" class="flex-1 flex flex-col gap-4">
            </div>

        <div id="grafik-box" class="glass-panel p-5 rounded-2xl shadow-xl flex-1 hidden flex-col relative">
            <h3 class="text-center font-bold text-gray-800 mb-2 tracking-wide flex justify-center items-center">
                <i class="fas fa-chart-line mr-2 text-blue-600"></i> Visualisasi Grafik
            </h3>
            <div class="text-center text-xs text-gray-500 mb-2 font-medium">
                <i class="fas fa-mouse mr-1"></i> Scroll untuk Zoom | Klik & Geser untuk Pan
                <button onclick="resetZoom()" class="ml-2 px-2 py-1 bg-gray-100 border border-gray-300 hover:bg-gray-200 rounded text-gray-700 transition">Reset View</button>
            </div>
            <div class="relative w-full flex-1 min-h-[400px]">
                <canvas id="grafikCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;
        
        // State management untuk sistem Step-by-Step UI
        let stepList = [];
        let currentStepIndex = -1;

        function resetZoom() {
            if (myChart) {
                myChart.resetZoom();
            }
        }

        // ----- SISTEM UI STEP-BY-STEP BARU -----
        function resetSteps() {
            stepList = [];
            currentStepIndex = -1;
        }

        function buatStep(judul, bgClass, textClass) {
            stepList.push({ judul, bgClass, textClass, konten: "" });
            currentStepIndex++;
        }

        function out(teks = "") {
            if (currentStepIndex >= 0) {
                stepList[currentStepIndex].konten += teks + "\n";
            }
        }

        function renderSteps() {
            let container = document.getElementById('step-container');
            container.innerHTML = "";
            
            stepList.forEach(step => {
                let card = document.createElement('div');
                // Tema terang untuk container
                card.className = "flex flex-col border border-gray-200 rounded-xl overflow-hidden shadow-sm bg-white";
                
                let header = document.createElement('div');
                header.className = `${step.bgClass} ${step.textClass} px-4 py-3 text-sm font-bold tracking-wide border-b border-gray-200`;
                header.innerHTML = step.judul;
                
                let body = document.createElement('div');
                body.className = "p-5 overflow-x-auto bg-gray-50/50";
                
                let pre = document.createElement('pre');
                pre.className = `font-mono text-sm whitespace-pre text-gray-800 leading-relaxed`;
                pre.innerHTML = step.konten.trimEnd(); 
                
                body.appendChild(pre);
                card.appendChild(header);
                card.appendChild(body);
                container.appendChild(card);
            });
        }

        // ----- UTILITAS MATEMATIKA -----
        function format_angka(angka) {
            return Number.isInteger(angka) ? angka : parseFloat(angka.toFixed(4));
        }

        function gcd_int(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while(b) { let t = b; b = a % b; a = t; }
            return a;
        }

        function bentuk_pecahan(num, den) {
            let mult = 1;
            while((num % 1 !== 0 || den % 1 !== 0) && mult <= 100000) {
                num *= 10; den *= 10; mult *= 10;
            }
            num = Math.round(num); den = Math.round(den);

            if (den === 0) return "Tak Terdefinisi";
            if (num === 0) return "0";
            
            let isNegative = (num < 0) ^ (den < 0);
            num = Math.abs(num); den = Math.abs(den);
            
            let fpb = gcd_int(num, den);
            num /= fpb; den /= fpb;
            
            let sign = isNegative ? "-" : "";
            if (den === 1) return `${sign}${num}`;
            return `${sign}${num}/${den}`;
        }

        function cetak_HP(a1, b1, c1, a2, b2, c2) {
            buatStep("HIMPUNAN PENYELESAIAN (HP)", "bg-amber-100", "text-amber-800");
            let D = a1 * b2 - a2 * b1;
            let Dx = c1 * b2 - c2 * b1;
            let Dy = a1 * c2 - a2 * c1;
            let str_x = bentuk_pecahan(Dx, D);
            let str_y = bentuk_pecahan(Dy, D);
            out(`Didapatkan hasil akhir:`);
            out(`x = ${str_x}`);
            out(`y = ${str_y}`);
            out(`\n✨ HP = { (${str_x}, ${str_y}) } ✨`);
        }

        function percantik(teks) {
            teks = String(teks);
            teks = teks.replace(/(?<![\d\.])-1x\b/g, '-x');
            teks = teks.replace(/(?<![\d\.])-1y\b/g, '-y');
            teks = teks.replace(/(?<![\d\.])1x\b/g, 'x');
            teks = teks.replace(/(?<![\d\.])1y\b/g, 'y');
            teks = teks.replace(/\+ -/g, "- ");
            teks = teks.replace(/- -/g, "+ ");
            teks = teks.replace(/\( -/g, "(-");
            return teks.trim();
        }

        function cetak_persamaan(a, b, c, no) {
            let tanda_b = b >= 0 ? "+" : "-";
            let teks = `${a}x ${tanda_b} ${Math.abs(b)}y = ${c}`;
            out(`Persamaan ${no}: ${percantik(teks)}`);
        }

        function hitung_lebar(...teksArr) {
            return Math.max(...teksArr.map(t => percantik(String(t)).length));
        }

        function cetak_baris(kiri, kanan, lebar) {
            let k_rapi = percantik(kiri);
            let kan_rapi = percantik(kanan);
            out(`      ${k_rapi.padStart(lebar, ' ')} = ${kan_rapi}`);
        }

        function cetak_eliminasi_sejajar(kiri1, kanan1, kiri2, kanan2, operator="(-)", ekstra=0) {
            let kr1 = percantik(kiri1), kn1 = percantik(kanan1);
            let kr2 = percantik(kiri2), kn2 = percantik(kanan2);
            let lebar_k = Math.max(kr1.length, kr2.length);
            
            out(`   ${kr1.padStart(lebar_k, ' ')} = ${kn1}`);
            out(`   ${kr2.padStart(lebar_k, ' ')} = ${kn2}`);
            let panjang_garis = lebar_k + 3 + Math.max(kn1.length, kn2.length) + ekstra;
            // Menggunakan underscore (___) untuk garis pecahan/eliminasi sesuai preferensi profesional
            out("   " + "_".repeat(panjang_garis) + ` ${operator}\n`);
        }

        function cetak_pecahan_sejajar(kiri, pembilang, penyebut, lebar) {
            let atas = percantik(String(pembilang));
            let bawah = percantik(String(penyebut));
            let panjang_garis = Math.max(atas.length, bawah.length) + 2;
            let centerStr = (str, len) => str.padStart(str.length + Math.floor((len - str.length) / 2), ' ').padEnd(len, ' ');
            
            out(`      ${" ".repeat(lebar)}   ${centerStr(atas, panjang_garis)}`);
            // Menggunakan underscore (___) untuk representasi pecahan
            out(`      ${percantik(String(kiri)).padStart(lebar, ' ')} = ${"_".repeat(panjang_garis)}`);
            out(`      ${" ".repeat(lebar)}   ${centerStr(bawah, panjang_garis)}`);
        }

        // ================= METODE SUBSTITUSI =================
        function metode_substitusi(a1, b1, c1, a2, b2, c2) {
            buatStep("1. UBAH PERSAMAAN UNTUK MENCARI 'x'", "bg-blue-100", "text-blue-800");
            let teks_l1 = `${a1}x = ${c1} - (${b1}y)`;
            out(`   ${percantik(teks_l1)}`);
            
            let L_x = hitung_lebar("x");
            cetak_pecahan_sejajar("x", `${c1} - (${b1}y)`, a1, L_x); 
            
            buatStep("2. SUBSTITUSI 'x' KE PERSAMAAN 2", "bg-purple-100", "text-purple-800");
            let tanda_b2_asli = b2 >= 0 ? "+" : "-";
            let teks_pers_2 = percantik(`${a2} [ (${c1} - ${b1}y) / ${a1} ] ${tanda_b2_asli} ${Math.abs(b2)}y = ${c2}`);
            out(`   ${teks_pers_2}`);
            
            let garis_bantu = "-".repeat(teks_pers_2.length);
            out(`   ${garis_bantu} (× ${a1})\n`);
            
            let k_b2 = format_angka(a1 * b2), k_c2 = format_angka(a1 * c2);
            let tanda_k_b2 = k_b2 >= 0 ? "+" : "-";
            let dist_c = format_angka(a2 * c1), dist_y = format_angka(a2 * b1);
            let tanda_dist_y = dist_y >= 0 ? "-" : "+";
            
            let y_kiri = format_angka(k_b2 - dist_y);
            let sisa_c = format_angka(k_c2 - dist_c);
            
            let k1 = `${a2}(${c1} - ${b1}y) ${tanda_k_b2} ${Math.abs(k_b2)}y`;
            let k2 = `${dist_c} ${tanda_dist_y} ${Math.abs(dist_y)}y ${tanda_k_b2} ${Math.abs(k_b2)}y`;
            let k3 = `${tanda_dist_y} ${Math.abs(dist_y)}y ${tanda_k_b2} ${Math.abs(k_b2)}y`;
            let k4 = `${y_kiri}y`;
            
            let L = hitung_lebar(k1, k2, k3, k4, "y");
            
            cetak_baris(k1, `${k_c2}`, L);
            cetak_baris(k2, `${k_c2}`, L);
            cetak_baris(k3, `${k_c2} - ${dist_c}`, L);
            cetak_baris(k4, `${sisa_c}`, L);
            cetak_pecahan_sejajar("y", sisa_c, y_kiri, L);
            
            let pecahan_y = bentuk_pecahan(sisa_c, y_kiri);
            cetak_baris("y", `${pecahan_y}`, L);
            
            buatStep("3. SUBSTITUSI 'y' UNTUK MENCARI 'x'", "bg-rose-100", "text-rose-800");
            let L2 = hitung_lebar("x"); 
            cetak_pecahan_sejajar("x", `${c1} - (${b1} × (${pecahan_y}))`, a1, L2);
            
            let hasil_kali_y_num = b1 * sisa_c;
            let hasil_kali_y_den = y_kiri;
            let sisa_atas_num = c1 * hasil_kali_y_den - hasil_kali_y_num;
            let sisa_atas_den = hasil_kali_y_den;
            let val_x_num = sisa_atas_num;
            let val_x_den = sisa_atas_den * a1;
            
            let pecahan_x = bentuk_pecahan(val_x_num, val_x_den);
            cetak_baris("x", `${pecahan_x}`, L2);
            
            cetak_HP(a1, b1, c1, a2, b2, c2);
        }

        // ================= METODE ELIMINASI =================
        function metode_eliminasi(a1, b1, c1, a2, b2, c2) {
            buatStep("1. ELIMINASI VARIABEL X (Mencari nilai y)", "bg-blue-100", "text-blue-800");
            let tanda_b1 = b1 >= 0 ? "+" : "-";
            let tanda_b2 = b2 >= 0 ? "+" : "-";
            let kiri_p1 = percantik(`${a1}x ${tanda_b1} ${Math.abs(b1)}y`);
            let kiri_p2 = percantik(`${a2}x ${tanda_b2} ${Math.abs(b2)}y`);
            
            let L_awal = Math.max(kiri_p1.length, kiri_p2.length);
            let p1_rata = `${kiri_p1.padStart(L_awal, ' ')} = ${c1}`;
            let p2_rata = `${kiri_p2.padStart(L_awal, ' ')} = ${c2}`;
            let panjang_maks = Math.max(p1_rata.length, p2_rata.length);

            out(`   ${p1_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(a2)}`);
            out(`   ${p2_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(a1)}`);
            out("   " + "_".repeat(panjang_maks + 10));
            
            let p1_a = format_angka(a1*Math.abs(a2)), p1_b = format_angka(b1*Math.abs(a2)), p1_c = format_angka(c1*Math.abs(a2));
            let p2_a = format_angka(a2*Math.abs(a1)), p2_b = format_angka(b2*Math.abs(a1)), p2_c = format_angka(c2*Math.abs(a1));
            
            let operator1 = (p1_a === p2_a) ? "(-)" : "(+)";
            cetak_eliminasi_sejajar(`${p1_a}x ${p1_b >= 0 ? "+" : "-"} ${Math.abs(p1_b)}y`, p1_c, `${p2_a}x ${p2_b >= 0 ? "+" : "-"} ${Math.abs(p2_b)}y`, p2_c, operator1);
            
            let sisa_b = (p1_a === p2_a) ? p1_b - p2_b : p1_b + p2_b;
            let sisa_c = (p1_a === p2_a) ? p1_c - p2_c : p1_c + p2_c;
            
            let k1 = `${format_angka(sisa_b)}y`;
            let L1 = hitung_lebar(k1, "y"); 
            
            cetak_baris(k1, `${format_angka(sisa_c)}`, L1);
            cetak_pecahan_sejajar("y", format_angka(sisa_c), format_angka(sisa_b), L1);
            cetak_baris("y", `${bentuk_pecahan(sisa_c, sisa_b)}`, L1);
            
            buatStep("2. ELIMINASI VARIABEL Y (Mencari nilai x)", "bg-purple-100", "text-purple-800");
            out(`   ${p1_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(b2)}`);
            out(`   ${p2_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(b1)}`);
            out("   " + "_".repeat(panjang_maks + 10));
            
            let p1_a_y = format_angka(a1*Math.abs(b2)), p1_b_y = format_angka(b1*Math.abs(b2)), p1_c_y = format_angka(c1*Math.abs(b2));
            let p2_a_y = format_angka(a2*Math.abs(b1)), p2_b_y = format_angka(b2*Math.abs(b1)), p2_c_y = format_angka(c2*Math.abs(b1));
            
            let operator2 = (p1_b_y === p2_b_y) ? "(-)" : "(+)";
            cetak_eliminasi_sejajar(`${p1_a_y}x ${p1_b_y >= 0 ? "+" : "-"} ${Math.abs(p1_b_y)}y`, p1_c_y, `${p2_a_y}x ${p2_b_y >= 0 ? "+" : "-"} ${Math.abs(p2_b_y)}y`, p2_c_y, operator2);
            
            let sisa_a_y = (p1_b_y === p2_b_y) ? p1_a_y - p2_a_y : p1_a_y + p2_a_y;
            let sisa_c_y = (p1_b_y === p2_b_y) ? p1_c_y - p2_c_y : p1_c_y + p2_c_y;
            
            let k2 = `${format_angka(sisa_a_y)}x`;
            let L2 = hitung_lebar(k2, "x");
            
            cetak_baris(k2, `${format_angka(sisa_c_y)}`, L2);
            cetak_pecahan_sejajar("x", format_angka(sisa_c_y), format_angka(sisa_a_y), L2);
            cetak_baris("x", `${bentuk_pecahan(sisa_c_y, sisa_a_y)}`, L2);
            
            cetak_HP(a1, b1, c1, a2, b2, c2);
        }

        // ================= METODE CAMPURAN =================
        function metode_campuran(a1, b1, c1, a2, b2, c2) {
            buatStep("1. ELIMINASI VARIABEL X (Mencari nilai y)", "bg-blue-100", "text-blue-800");
            let tanda_b1 = b1 >= 0 ? "+" : "-";
            let tanda_b2 = b2 >= 0 ? "+" : "-";
            let kiri_p1 = percantik(`${a1}x ${tanda_b1} ${Math.abs(b1)}y`);
            let kiri_p2 = percantik(`${a2}x ${tanda_b2} ${Math.abs(b2)}y`);
            
            let L_awal = Math.max(kiri_p1.length, kiri_p2.length);
            let p1_rata = `${kiri_p1.padStart(L_awal, ' ')} = ${c1}`;
