<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQUALINE | Kalkulator SPLDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap');

        body { 
            background-color: #F4EAD5; 
            color: #1c1917; 
            font-family: 'Space Grotesk', sans-serif; 
            min-height: 100vh;
        }
        
        .retro-card {
            border: 4px solid #1c1917;
            border-radius: 1.25rem;
            box-shadow: 8px 8px 0px #1c1917;
            transition: all 0.2s ease;
        }
        .retro-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 11px 11px 0px #1c1917;
        }

        .input-box { 
            background-color: #F4EAD5; 
            border: 4px solid #1c1917; 
            color: #1c1917; 
            border-radius: 0.75rem; 
            padding: 1rem 1.2rem; 
            width: 100%; 
            outline: none; 
            font-size: 2.2rem; 
            font-weight: 800;
            text-align: center;
            transition: all 0.2s; 
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.06);
        }

        .input-box:focus { 
            background-color: #fef08a; 
            box-shadow: 5px 5px 0px #1c1917;
            transform: translate(-2px, -2px);
        }
        
        .math-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem; 
            line-height: 2;
            font-weight: 700;
            color: #1c1917;
        }

        ::-webkit-scrollbar { width: 14px; height: 14px; }
        ::-webkit-scrollbar-track { background: #F4EAD5; border-left: 3px solid #1c1917; border-top: 3px solid #1c1917;}
        ::-webkit-scrollbar-thumb { background: #1c1917; border-radius: 0px; }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center min-h-screen">

    <div class="max-w-6xl w-full text-center mb-12 mt-4">
        <h1 class="text-6xl md:text-8xl font-extrabold text-[#1c1917] tracking-tight mb-6 drop-shadow-[5px_5px_0px_#f97316]">
            EQUALINE
        </h1>
        <p class="text-stone-800 font-bold text-2xl md:text-3xl bg-[#fcd34d] inline-block px-6 py-3 border-4 border-stone-800 rounded-xl shadow-[5px_5px_0px_#1c1917]">
            Kalkulator Sistem Persamaan Linear Dua Variabel
        </p>
    </div>

    <div class="max-w-[95%] xl:max-w-7xl w-full grid grid-cols-1 lg:grid-cols-3 gap-8 md:gap-10 mx-auto">
        
        <div class="retro-card bg-[#FFC4D9] p-8 md:p-10">
            <h2 class="text-4xl lg:text-5xl font-extrabold mb-10 flex items-center justify-center text-stone-900 border-b-4 border-stone-900 pb-6 text-center">
                <span class="w-16 h-16 rounded-full bg-stone-900 text-[#FFC4D9] flex items-center justify-center mr-5 text-3xl border-4 border-stone-900">1</span>
                Persamaan 1
            </h2>
            <div class="space-y-8 text-center">
                <div><label class="block text-2xl lg:text-3xl text-stone-900 font-extrabold uppercase tracking-wide mb-3">Koefisien X</label><input type="number" id="a1" value="2" class="input-box"></div>
                <div><label class="block text-2xl lg:text-3xl text-stone-900 font-extrabold uppercase tracking-wide mb-3">Koefisien Y</label><input type="number" id="b1" value="3" class="input-box"></div>
                <div><label class="block text-2xl lg:text-3xl text-stone-900 font-extrabold uppercase tracking-wide mb-3">Konstanta</label><input type="number" id="c1" value="12" class="input-box"></div>
            </div>
        </div>

        <div class="retro-card bg-[#9BF6FF] p-8 md:p-10">
            <h2 class="text-4xl lg:text-5xl font-extrabold mb-10 flex items-center justify-center text-stone-900 border-b-4 border-stone-900 pb-6 text-center">
                <span class="w-16 h-16 rounded-full bg-stone-900 text-[#9BF6FF] flex items-center justify-center mr-5 text-3xl border-4 border-stone-900">2</span>
                Persamaan 2
            </h2>
            <div class="space-y-8 text-center">
                <div><label class="block text-2xl lg:text-3xl text-stone-900 font-extrabold uppercase tracking-wide mb-3">Koefisien X</label><input type="number" id="a2" value="1" class="input-box"></div>
                <div><label class="block text-2xl lg:text-3xl text-stone-900 font-extrabold uppercase tracking-wide mb-3">Koefisien Y</label><input type="number" id="b2" value="-1" class="input-box"></div>
                <div><label class="block text-2xl lg:text-3xl text-stone-900 font-extrabold uppercase tracking-wide mb-3">Konstanta</label><input type="number" id="c2" value="1" class="input-box"></div>
            </div>
        </div>

        <div class="retro-card bg-[#FDFFB6] p-8 md:p-10 flex flex-col">
            <label class="text-3xl lg:text-4xl text-stone-900 font-extrabold mb-8 border-b-4 border-stone-900 pb-6 text-center">Pilih Metode:</label>
            
            <div class="grid grid-cols-1 gap-5 mb-10">
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="1" class="peer hidden">
                    <div class="peer-checked:bg-[#f97316] peer-checked:text-stone-900 bg-[#F4EAD5] border-4 border-stone-900 text-stone-800 rounded-xl p-5 text-center transition-all hover:bg-[#ffedd5] shadow-[4px_4px_0px_#1c1917] peer-checked:translate-x-[3px] peer-checked:translate-y-[3px] peer-checked:shadow-[1px_1px_0px_#1c1917]">
                        <div class="font-extrabold text-2xl">Substitusi</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="2" class="peer hidden">
                    <div class="peer-checked:bg-[#f97316] peer-checked:text-stone-900 bg-[#F4EAD5] border-4 border-stone-900 text-stone-800 rounded-xl p-5 text-center transition-all hover:bg-[#ffedd5] shadow-[4px_4px_0px_#1c1917] peer-checked:translate-x-[3px] peer-checked:translate-y-[3px] peer-checked:shadow-[1px_1px_0px_#1c1917]">
                        <div class="font-extrabold text-2xl">Eliminasi</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="3" class="peer hidden">
                    <div class="peer-checked:bg-[#f97316] peer-checked:text-stone-900 bg-[#F4EAD5] border-4 border-stone-900 text-stone-800 rounded-xl p-5 text-center transition-all hover:bg-[#ffedd5] shadow-[4px_4px_0px_#1c1917] peer-checked:translate-x-[3px] peer-checked:translate-y-[3px] peer-checked:shadow-[1px_1px_0px_#1c1917]">
                        <div class="font-extrabold text-2xl">Campuran</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="metode" value="4" class="peer hidden" checked>
                    <div class="peer-checked:bg-[#f97316] peer-checked:text-stone-900 bg-[#F4EAD5] border-4 border-stone-900 text-stone-800 rounded-xl p-5 text-center transition-all hover:bg-[#ffedd5] shadow-[4px_4px_0px_#1c1917] peer-checked:translate-x-[3px] peer-checked:translate-y-[3px] peer-checked:shadow-[1px_1px_0px_#1c1917]">
                        <div class="font-extrabold text-2xl">Grafik</div>
                    </div>
                </label>
            </div>
            
            <button onclick="jalankanKalkulator()" class="mt-auto w-full bg-[#10b981] hover:bg-[#059669] text-stone-900 border-4 border-stone-900 font-extrabold text-3xl lg:text-4xl py-6 px-6 rounded-2xl shadow-[6px_6px_0px_#1c1917] transition-all transform hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-[3px_3px_0px_#1c1917] flex items-center justify-center tracking-wide">
                HITUNG! <i class="fas fa-bolt ml-4"></i>
            </button>
        </div>
    </div>

    <div id="hasil-container" class="max-w-[95%] xl:max-w-7xl w-full mt-14 hidden flex-col xl:flex-row gap-10 animate-pop-in mx-auto">
        
        <div id="step-container" class="flex-1 flex flex-col gap-10">
            </div>

        <div id="grafik-box" class="retro-card bg-[#CAFFBF] p-8 flex-1 hidden flex-col relative h-fit sticky top-6">
            <div class="flex justify-between items-center mb-8 border-b-4 border-stone-900 pb-5">
                <h3 class="font-extrabold text-3xl md:text-4xl text-stone-900 flex items-center">
                    <i class="fas fa-chart-area mr-4 text-4xl"></i> VISUAL GRAFIK
                </h3>
                <button onclick="resetZoom()" class="px-5 py-3 bg-[#F4EAD5] border-4 border-stone-900 hover:bg-[#fcd34d] rounded-xl text-stone-900 text-lg font-extrabold shadow-[3px_3px_0px_#1c1917] transition-all">
                    <i class="fas fa-compress-arrows-alt mr-2"></i> RESET
                </button>
            </div>
            <div class="relative w-full flex-1 min-h-[500px] bg-[#F4EAD5] border-4 border-stone-900 rounded-xl overflow-hidden">
                <canvas id="grafikCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;
        let stepList = [];
        let currentStepIndex = -1;

        function resetZoom() {
            if (myChart) myChart.resetZoom();
        }

        function resetSteps() {
            stepList = [];
            currentStepIndex = -1;
        }

        function buatStep(judul, bgClass, textClass) {
            stepList.push({ judul, bgClass, textClass, konten: "" });
            currentStepIndex++;
        }

        function out(teks = "") {
            if (currentStepIndex >= 0) {
                stepList[currentStepIndex].konten += teks + "\n";
            }
        }

        function renderSteps() {
            let container = document.getElementById('step-container');
            container.innerHTML = "";
            
            stepList.forEach(step => {
                let card = document.createElement('div');
                card.className = "retro-card overflow-hidden bg-[#F4EAD5]";
                
                let header = document.createElement('div');
                header.className = `${step.bgClass} ${step.textClass} px-8 py-6 text-2xl md:text-3xl font-extrabold border-b-4 border-stone-900 uppercase tracking-wide`;
                header.innerHTML = step.judul;
                
                let body = document.createElement('div');
                body.className = "p-8 md:p-10 overflow-x-auto";
                
                let pre = document.createElement('pre');
                pre.className = `math-text whitespace-pre`;
                pre.innerHTML = step.konten.trimEnd(); 
                
                body.appendChild(pre);
                card.appendChild(header);
                card.appendChild(body);
                container.appendChild(card);
            });
        }

        // ----- UTILITAS MATEMATIKA -----
        function format_angka(angka) {
            return Number.isInteger(angka) ? angka : parseFloat(angka.toFixed(4));
        }

        function gcd_int(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while(b) { let t = b; b = a % b; a = t; }
            return a;
        }

        function bentuk_pecahan(num, den) {
            let mult = 1;
            while((num % 1 !== 0 || den % 1 !== 0) && mult <= 100000) {
                num *= 10; den *= 10; mult *= 10;
            }
            num = Math.round(num); den = Math.round(den);

            if (den === 0) return "Tak Terdefinisi";
            if (num === 0) return "0";
            
            let isNegative = (num < 0) ^ (den < 0);
            num = Math.abs(num); den = Math.abs(den);
            
            let fpb = gcd_int(num, den);
            num /= fpb; den /= fpb;
            
            let sign = isNegative ? "-" : "";
            if (den === 1) return `${sign}${num}`;
            return `${sign}${num}/${den}`;
        }

        function cetak_HP(a1, b1, c1, a2, b2, c2) {
            buatStep("✨ HIMPUNAN PENYELESAIAN (HP) ✨", "bg-[#10b981]", "text-stone-900");
            let D = a1 * b2 - a2 * b1;
            let Dx = c1 * b2 - c2 * b1;
            let Dy = a1 * c2 - a2 * c1;
            let str_x = bentuk_pecahan(Dx, D);
            let str_y = bentuk_pecahan(Dy, D);
            out(`Solusi Akhir:`);
            out(`x = ${str_x}`);
            out(`y = ${str_y}`);
            out(`\nHP = { (${str_x}, ${str_y}) }`);
        }

        function percantik(teks) {
            teks = String(teks);
            teks = teks.replace(/(?<![\d\.])-1x\b/g, '-x');
            teks = teks.replace(/(?<![\d\.])-1y\b/g, '-y');
            teks = teks.replace(/(?<![\d\.])1x\b/g, 'x');
            teks = teks.replace(/(?<![\d\.])1y\b/g, 'y');
            teks = teks.replace(/\+ -/g, "- ");
            teks = teks.replace(/- -/g, "+ ");
            teks = teks.replace(/\( -/g, "(-");
            return teks.trim();
        }

        function cetak_persamaan(a, b, c, no) {
            let tanda_b = b >= 0 ? "+" : "-";
            let teks = `${a}x ${tanda_b} ${Math.abs(b)}y = ${c}`;
            out(`Persamaan ${no}: ${percantik(teks)}`);
        }

        function hitung_lebar(...teksArr) {
            return Math.max(...teksArr.map(t => percantik(String(t)).length));
        }

        function cetak_baris(kiri, kanan, lebar) {
            let k_rapi = percantik(kiri);
            let kan_rapi = percantik(kanan);
            out(`      ${k_rapi.padStart(lebar, ' ')} = ${kan_rapi}`);
        }

        function cetak_eliminasi_sejajar(kiri1, kanan1, kiri2, kanan2, operator="(-)", ekstra=0) {
            let kr1 = percantik(kiri1), kn1 = percantik(kanan1);
            let kr2 = percantik(kiri2), kn2 = percantik(kanan2);
            let lebar_k = Math.max(kr1.length, kr2.length);
            
            out(`   ${kr1.padStart(lebar_k, ' ')} = ${kn1}`);
            out(`   ${kr2.padStart(lebar_k, ' ')} = ${kn2}`);
            let panjang_garis = lebar_k + 3 + Math.max(kn1.length, kn2.length) + ekstra;
            out("   " + "_".repeat(panjang_garis) + ` ${operator}\n`);
        }

        function cetak_pecahan_sejajar(kiri, pembilang, penyebut, lebar) {
            let atas = percantik(String(pembilang));
            let bawah = percantik(String(penyebut));
            let panjang_garis = Math.max(atas.length, bawah.length) + 2;
            let centerStr = (str, len) => str.padStart(str.length + Math.floor((len - str.length) / 2), ' ').padEnd(len, ' ');
            
            out(`      ${" ".repeat(lebar)}   ${centerStr(atas, panjang_garis)}`);
            out(`      ${percantik(String(kiri)).padStart(lebar, ' ')} = ${"_".repeat(panjang_garis)}`);
            out(`      ${" ".repeat(lebar)}   ${centerStr(bawah, panjang_garis)}`);
        }

        // ================= METODE SUBSTITUSI =================
        function metode_substitusi(a1, b1, c1, a2, b2, c2) {
            buatStep("1. UBAH PERSAMAAN UNTUK MENCARI 'x'", "bg-[#fcd34d]", "text-stone-900");
            let teks_l1 = `${a1}x = ${c1} - (${b1}y)`;
            out(`   ${percantik(teks_l1)}`);
            
            let L_x = hitung_lebar("x");
            cetak_pecahan_sejajar("x", `${c1} - (${b1}y)`, a1, L_x); 
            
            buatStep("2. SUBSTITUSI 'x' KE PERSAMAAN 2", "bg-[#fcd34d]", "text-stone-900");
            let tanda_b2_asli = b2 >= 0 ? "+" : "-";
            let teks_pers_2 = percantik(`${a2} [ (${c1} - ${b1}y) / ${a1} ] ${tanda_b2_asli} ${Math.abs(b2)}y = ${c2}`);
            out(`   ${teks_pers_2}`);
            
            let garis_bantu = "-".repeat(teks_pers_2.length);
            out(`   ${garis_bantu} (× ${a1})\n`);
            
            let k_b2 = format_angka(a1 * b2), k_c2 = format_angka(a1 * c2);
            let tanda_k_b2 = k_b2 >= 0 ? "+" : "-";
            let dist_c = format_angka(a2 * c1), dist_y = format_angka(a2 * b1);
            let tanda_dist_y = dist_y >= 0 ? "-" : "+";
            
            let y_kiri = format_angka(k_b2 - dist_y);
            let sisa_c = format_angka(k_c2 - dist_c);
            
            let k1 = `${a2}(${c1} - ${b1}y) ${tanda_k_b2} ${Math.abs(k_b2)}y`;
            let k2 = `${dist_c} ${tanda_dist_y} ${Math.abs(dist_y)}y ${tanda_k_b2} ${Math.abs(k_b2)}y`;
            let k3 = `${tanda_dist_y} ${Math.abs(dist_y)}y ${tanda_k_b2} ${Math.abs(k_b2)}y`;
            let k4 = `${y_kiri}y`;
            
            let L = hitung_lebar(k1, k2, k3, k4, "y");
            
            cetak_baris(k1, `${k_c2}`, L);
            cetak_baris(k2, `${k_c2}`, L);
            cetak_baris(k3, `${k_c2} - ${dist_c}`, L);
            cetak_baris(k4, `${sisa_c}`, L);
            cetak_pecahan_sejajar("y", sisa_c, y_kiri, L);
            
            let pecahan_y = bentuk_pecahan(sisa_c, y_kiri);
            cetak_baris("y", `${pecahan_y}`, L);
            
            buatStep("3. SUBSTITUSI 'y' UNTUK MENCARI 'x'", "bg-[#fcd34d]", "text-stone-900");
            let L2 = hitung_lebar("x"); 
            cetak_pecahan_sejajar("x", `${c1} - (${b1} × (${pecahan_y}))`, a1, L2);
            
            let hasil_kali_y_num = b1 * sisa_c;
            let hasil_kali_y_den = y_kiri;
            let sisa_atas_num = c1 * hasil_kali_y_den - hasil_kali_y_num;
            let sisa_atas_den = hasil_kali_y_den;
            let val_x_num = sisa_atas_num;
            let val_x_den = sisa_atas_den * a1;
            
            let pecahan_x = bentuk_pecahan(val_x_num, val_x_den);
            cetak_baris("x", `${pecahan_x}`, L2);
            
            cetak_HP(a1, b1, c1, a2, b2, c2);
        }

        // ================= METODE ELIMINASI =================
        function metode_eliminasi(a1, b1, c1, a2, b2, c2) {
            buatStep("1. ELIMINASI VARIABEL X (Mencari nilai y)", "bg-[#fcd34d]", "text-stone-900");
            let tanda_b1 = b1 >= 0 ? "+" : "-";
            let tanda_b2 = b2 >= 0 ? "+" : "-";
            let kiri_p1 = percantik(`${a1}x ${tanda_b1} ${Math.abs(b1)}y`);
            let kiri_p2 = percantik(`${a2}x ${tanda_b2} ${Math.abs(b2)}y`);
            
            let L_awal = Math.max(kiri_p1.length, kiri_p2.length);
            let p1_rata = `${kiri_p1.padStart(L_awal, ' ')} = ${c1}`;
            let p2_rata = `${kiri_p2.padStart(L_awal, ' ')} = ${c2}`;
            let panjang_maks = Math.max(p1_rata.length, p2_rata.length);

            out(`   ${p1_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(a2)}`);
            out(`   ${p2_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(a1)}`);
            out("   " + "_".repeat(panjang_maks + 10));
            
            let p1_a = format_angka(a1*Math.abs(a2)), p1_b = format_angka(b1*Math.abs(a2)), p1_c = format_angka(c1*Math.abs(a2));
            let p2_a = format_angka(a2*Math.abs(a1)), p2_b = format_angka(b2*Math.abs(a1)), p2_c = format_angka(c2*Math.abs(a1));
            
            let operator1 = (p1_a === p2_a) ? "(-)" : "(+)";
            cetak_eliminasi_sejajar(`${p1_a}x ${p1_b >= 0 ? "+" : "-"} ${Math.abs(p1_b)}y`, p1_c, `${p2_a}x ${p2_b >= 0 ? "+" : "-"} ${Math.abs(p2_b)}y`, p2_c, operator1);
            
            let sisa_b = (p1_a === p2_a) ? p1_b - p2_b : p1_b + p2_b;
            let sisa_c = (p1_a === p2_a) ? p1_c - p2_c : p1_c + p2_c;
            
            let k1 = `${format_angka(sisa_b)}y`;
            let L1 = hitung_lebar(k1, "y"); 
            
            cetak_baris(k1, `${format_angka(sisa_c)}`, L1);
            cetak_pecahan_sejajar("y", format_angka(sisa_c), format_angka(sisa_b), L1);
            cetak_baris("y", `${bentuk_pecahan(sisa_c, sisa_b)}`, L1);
            
            buatStep("2. ELIMINASI VARIABEL Y (Mencari nilai x)", "bg-[#fcd34d]", "text-stone-900");
            out(`   ${p1_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(b2)}`);
            out(`   ${p2_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(b1)}`);
            out("   " + "_".repeat(panjang_maks + 10));
            
            let p1_a_y = format_angka(a1*Math.abs(b2)), p1_b_y = format_angka(b1*Math.abs(b2)), p1_c_y = format_angka(c1*Math.abs(b2));
            let p2_a_y = format_angka(a2*Math.abs(b1)), p2_b_y = format_angka(b2*Math.abs(b1)), p2_c_y = format_angka(c2*Math.abs(b1));
            
            let operator2 = (p1_b_y === p2_b_y) ? "(-)" : "(+)";
            cetak_eliminasi_sejajar(`${p1_a_y}x ${p1_b_y >= 0 ? "+" : "-"} ${Math.abs(p1_b_y)}y`, p1_c_y, `${p2_a_y}x ${p2_b_y >= 0 ? "+" : "-"} ${Math.abs(p2_b_y)}y`, p2_c_y, operator2);
            
            let sisa_a_y = (p1_b_y === p2_b_y) ? p1_a_y - p2_a_y : p1_a_y + p2_a_y;
            let sisa_c_y = (p1_b_y === p2_b_y) ? p1_c_y - p2_c_y : p1_c_y + p2_c_y;
            
            let k2 = `${format_angka(sisa_a_y)}x`;
            let L2 = hitung_lebar(k2, "x");
            
            cetak_baris(k2, `${format_angka(sisa_c_y)}`, L2);
            cetak_pecahan_sejajar("x", format_angka(sisa_c_y), format_angka(sisa_a_y), L2);
            cetak_baris("x", `${bentuk_pecahan(sisa_c_y, sisa_a_y)}`, L2);
            
            cetak_HP(a1, b1, c1, a2, b2, c2);
        }

        // ================= METODE CAMPURAN =================
        function metode_campuran(a1, b1, c1, a2, b2, c2) {
            buatStep("1. ELIMINASI VARIABEL X (Mencari nilai y)", "bg-[#fcd34d]", "text-stone-900");
            let tanda_b1 = b1 >= 0 ? "+" : "-";
            let tanda_b2 = b2 >= 0 ? "+" : "-";
            let kiri_p1 = percantik(`${a1}x ${tanda_b1} ${Math.abs(b1)}y`);
            let kiri_p2 = percantik(`${a2}x ${tanda_b2} ${Math.abs(b2)}y`);
            
            let L_awal = Math.max(kiri_p1.length, kiri_p2.length);
            let p1_rata = `${kiri_p1.padStart(L_awal, ' ')} = ${c1}`;
            let p2_rata = `${kiri_p2.padStart(L_awal, ' ')} = ${c2}`;
            let panjang_maks = Math.max(p1_rata.length, p2_rata.length);

            out(`   ${p1_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(a2)}`);
            out(`   ${p2_rata.padEnd(panjang_maks, ' ')} | × ${Math.abs(a1)}`);
            out("   " + "_".repeat(panjang_maks + 10));
            
            let p1_a = format_angka(a1*Math.abs(a2)), p1_b = format_angka(b1*Math.abs(a2)), p1_c = format_angka(c1*Math.abs(a2));
            let p2_a = format_angka(a2*Math.abs(a1)), p2_b = format_angka(b2*Math.abs(a1)), p2_c = format_angka(c2*Math.abs(a1));
            
            let operator1 = (p1_a === p2_a) ? "(-)" : "(+)";
            cetak_eliminasi_sejajar(`${p1_a}x ${p1_b >= 0 ? "+" : "-"} ${Math.abs(p1_b)}y`, p1_c, `${p2_a}x ${p2_b >= 0 ? "+" : "-"} ${Math.abs(p2_b)}y`, p2_c, operator1);
            
            let sisa_b = (p1_a === p2_a) ? p1_b - p2_b : p1_b + p2_b;
            let sisa_c = (p1_a === p2_a) ? p1_c - p2_c : p1_c + p2_c;
            
            let k1 = `${format_angka(sisa_b)}y`;
            let L1 = hitung_lebar(k1, "y");
            
            cetak_baris(k1, `${format_angka(sisa_c)}`, L1);
            cetak_pecahan_sejajar("y", format_angka(sisa_c), format_angka(sisa_b), L1);
            let pecahan_y = bentuk_pecahan(sisa_c, sisa_b);
            cetak_baris("y", `${pecahan_y}`, L1);
            
            buatStep("2. SUBSTITUSI NILAI 'y' KE PERSAMAAN 1", "bg-[#fcd34d]", "text-stone-900");
            let teks_subst = `${a1}x + ${b1}(${pecahan_y}) = ${c1}`;
            out(`   ${percantik(teks_subst)}\n`);
            
            let val_x_num = c1 * sisa_b - b1 * sisa_c;
            let val_x_den = a1 * sisa_b;
            let pecahan_x = bentuk_pecahan(val_x_num, val_x_den);
            
            cetak_baris("x", `${pecahan_x}`, hitung_lebar("x"));
            
            cetak_HP(a1, b1, c1, a2, b2, c2);
        }

        // ================= METODE GRAFIK =================
        function jabarkan_tabel(a, b, c, nama) {
            let tanda_b = b >= 0 ? "+" : "-";
            let teks_grafik = `${a}x ${tanda_b} ${Math.abs(b)}y = ${c}`;
            out(`\n>> ${nama}: ${percantik(teks_grafik)}\n`);

            if (c === 0) {
                out(`   - Garis melewati titik pusat (0,0).\n`);
                let x_uji = b !== 0 ? b : 1;
                let y_uji = b !== 0 ? format_angka(-a * x_uji / b) : 0;
                let y_val = bentuk_pecahan(-a*x_uji, b);
                
                let tbl = `   <div class="inline-block mt-3 mb-6"><table class="border-4 border-stone-900 bg-white text-center shadow-[4px_4px_0px_#1c1917] rounded-xl overflow-hidden font-bold">
                    <tr class="border-b-4 border-stone-900">
                        <th class="border-r-4 border-stone-900 bg-[#fcd34d] px-6 py-3 font-extrabold w-32">x</th>
                        <td class="border-r-4 border-stone-900 px-6 py-3 w-32">0</td>
                        <td class="px-6 py-3 w-32">${x_uji}</td>
                    </tr>
                    <tr class="border-b-4 border-stone-900">
                        <th class="border-r-4 border-stone-900 bg-[#fcd34d] px-6 py-3 font-extrabold">y</th>
                        <td class="border-r-4 border-stone-900 px-6 py-3">0</td>
                        <td class="px-6 py-3">${y_val}</td>
                    </tr>
                    <tr>
                        <th class="border-r-4 border-stone-900 bg-[#fcd34d] px-6 py-3 font-extrabold">(x, y)</th>
                        <td class="border-r-4 border-stone-900 px-6 py-3">(0, 0)</td>
                        <td class="px-6 py-3">(${x_uji}, ${y_val})</td>
                    </tr>
                </table></div>`;
                out(tbl);
            } else {
                let y_potong = b !== 0 ? bentuk_pecahan(c, b) : "-";
                let x_potong = a !== 0 ? bentuk_pecahan(c, a) : "-";

                let str_p1 = b !== 0 ? `(0, ${y_potong})` : "-";
                let str_p2 = a !== 0 ? `(${x_potong}, 0)` : "-";
                
                let tbl = `   <div class="inline-block mt-3 mb-6"><table class="border-4 border-stone-900 bg-white text-center shadow-[4px_4px_0px_#1c1917] rounded-xl overflow-hidden font-bold">
                    <tr class="border-b-4 border-stone-900">
                        <th class="border-r-4 border-stone-900 bg-[#fcd34d] px-6 py-3 font-extrabold w-32">x</th>
                        <td class="border-r-4 border-stone-900 px-6 py-3 w-32">0</td>
                        <td class="px-6 py-3 w-32">${x_potong}</td>
                    </tr>
                    <tr class="border-b-4 border-stone-900">
                        <th class="border-r-4 border-stone-900 bg-[#fcd34d] px-6 py-3 font-extrabold">y</th>
                        <td class="border-r-4 border-stone-900 px-6 py-3">${y_potong}</td>
                        <td class="px-6 py-3">0</td>
                    </tr>
                    <tr>
                        <th class="border-r-4 border-stone-900 bg-[#fcd34d] px-6 py-3 font-extrabold">(x, y)</th>
                        <td class="border-r-4 border-stone-900 px-6 py-3">${str_p1}</td>
                        <td class="px-6 py-3">${str_p2}</td>
                    </tr>
                </table></div>`;
                out(tbl);
            }
        }

        function metode_grafik(a1, b1, c1, a2, b2, c2) {
            buatStep("1. TITIK POTONG SUMBU (Tabel Koordinat)", "bg-[#fcd34d]", "text-stone-900");
            
            jabarkan_tabel(a1, b1, c1, "Garis 1 (Pink)");
            jabarkan_tabel(a2, b2, c2, "Garis 2 (Biru)");

            buatStep("2. ANALISIS GRAFIK", "bg-[#fcd34d]", "text-stone-900");
            let D = a1 * b2 - a2 * b1;
            if (D === 0) {
                out("Garis sejajar atau berimpit, tidak ada satu titik potong pasti.");
                return;
            }

            let Dx = c1 * b2 - c2 * b1;
            let Dy = a1 * c2 - a2 * c1;
            
            out(`Berdasarkan grafik di samping, kedua garis berpotongan di titik (x, y).`);
            cetak_HP(a1, b1, c1, a2, b2, c2);

            let x_float = Dx / D;
            let y_float = Dy / D;
            gambarGrafikJS(a1, b1, c1, a2, b2, c2, x_float, y_float, bentuk_pecahan(Dx, D), bentuk_pecahan(Dy, D));
        }

        // ================= FUNGSI UPDATE GARIS DINAMIS =================
        function perbaruiGaris(chart, a1, b1, c1, a2, b2, c2, x_sol, y_sol) {
            let minX = chart.scales.x.min;
            let maxX = chart.scales.x.max;
            let minY = chart.scales.y.min;
            let maxY = chart.scales.y.max;
            
            let marginX = Math.abs(maxX - minX);
            let marginY = Math.abs(maxY - minY);
            
            let x_awal = minX - marginX;
            let x_akhir = maxX + marginX;
            let y_awal = minY - marginY;
            let y_akhir = maxY + marginY;

            let cariY = (a, b, c, val_x) => (c - (a * val_x)) / b;

            if (b1 !== 0) {
                chart.data.datasets[0].data = [
                    {x: x_awal, y: cariY(a1, b1, c1, x_awal)}, 
                    {x: x_sol, y: y_sol}, 
                    {x: x_akhir, y: cariY(a1, b1, c1, x_akhir)}
                ];
            } else { 
                chart.data.datasets[0].data = [
                    {x: c1/a1, y: y_awal}, {x: c1/a1, y: y_sol}, {x: c1/a1, y: y_akhir}
                ];
            }

            if (b2 !== 0) {
                chart.data.datasets[1].data = [
                    {x: x_awal, y: cariY(a2, b2, c2, x_awal)}, 
                    {x: x_sol, y: y_sol}, 
                    {x: x_akhir, y: cariY(a2, b2, c2, x_akhir)}
                ];
            } else { 
                chart.data.datasets[1].data = [
                    {x: c2/a2, y: y_awal}, {x: c2/a2, y: y_sol}, {x: c2/a2, y: y_akhir}
                ];
            }

            chart.update('none'); 
        }

        // ================= GAMBAR GRAFIK (CHART.JS) =================
        function gambarGrafikJS(a1, b1, c1, a2, b2, c2, x_sol, y_sol, str_x, str_y) {
            let box = document.getElementById('grafik-box');
            box.classList.remove('hidden');

            let ctx = document.getElementById('grafikCanvas').getContext('2d');
            if(myChart) myChart.destroy();

            let view_rentang = 10;
            let x_min = Math.floor(x_sol) - view_rentang;
            let x_max = Math.ceil(x_sol) + view_rentang;

            let cariY = (a, b, c, val_x) => (c - (a * val_x)) / b;
            
            let dataGaris1 = b1 !== 0 
                ? [{x: x_min, y: cariY(a1, b1, c1, x_min)}, {x: x_sol, y: y_sol}, {x: x_max, y: cariY(a1, b1, c1, x_max)}] 
                : [{x: c1/a1, y: y_sol-view_rentang}, {x: c1/a1, y: y_sol}, {x: c1/a1, y: y_sol+view_rentang}];
                
            let dataGaris2 = b2 !== 0 
                ? [{x: x_min, y: cariY(a2, b2, c2, x_min)}, {x: x_sol, y: y_sol}, {x: x_max, y: cariY(a2, b2, c2, x_max)}] 
                : [{x: c2/a2, y: y_sol-view_rentang}, {x: c2/a2, y: y_sol}, {x: c2/a2, y: y_sol+view_rentang}];

            Chart.defaults.color = '#1c1917';
            Chart.defaults.font.family = 'Space Grotesk';
            Chart.defaults.font.size = 16;

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        { label: 'Garis 1 (Pink)', data: dataGaris1, borderColor: '#f43f5e', backgroundColor: 'transparent', borderWidth: 6, pointRadius: 0, tension: 0 },
                        { label: 'Garis 2 (Biru)', data: dataGaris2, borderColor: '#0ea5e9', backgroundColor: 'transparent', borderWidth: 6, pointRadius: 0, tension: 0 },
                        { label: `Titik Potong HP`, data: [{x: x_sol, y: y_sol}], backgroundColor: '#f97316', borderColor: '#1c1917', borderWidth: 5, pointRadius: 12, pointHoverRadius: 15, type: 'scatter' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 15, padding: 30, font: {weight: 'bold', size: 16} } },
                        tooltip: {
                            backgroundColor: '#1c1917',
                            titleColor: '#F4EAD5',
                            bodyColor: '#F4EAD5',
                            titleFont: { size: 18, weight: 'bold' },
                            bodyFont: { size: 18 },
                            padding: 18,
                            cornerRadius: 12,
                            callbacks: {
                                label: function(context) {
                                    if(context.datasetIndex === 2) return ` HP: (${str_x}, ${str_y})`;
                                    return ` (x: ${context.parsed.x.toFixed(2)}, y: ${context.parsed.y.toFixed(2)})`;
                                }
                            }
                        },
                        zoom: {
                            pan: { 
                                enabled: true, mode: 'xy', threshold: 10,
                                onPan: function({chart}) { perbaruiGaris(chart, a1, b1, c1, a2, b2, c2, x_sol, y_sol); }
                            },
                            zoom: { 
                                wheel: { enabled: true, speed: 0.1 }, pinch: { enabled: true }, mode: 'xy',
                                onZoom: function({chart}) { perbaruiGaris(chart, a1, b1, c1, a2, b2, c2, x_sol, y_sol); }
                            }
                        }
                    },
                    scales: { 
                        x: { 
                            type: 'linear', min: x_sol - view_rentang, max: x_sol + view_rentang,
                            grid: { color: (ctx) => ctx.tick.value === 0 ? '#1c1917' : 'rgba(28, 25, 23, 0.1)', lineWidth: (ctx) => ctx.tick.value === 0 ? 4 : 2 }
                        }, 
                        y: { 
                            type: 'linear', min: y_sol - view_rentang, max: y_sol + view_rentang,
                            grid: { color: (ctx) => ctx.tick.value === 0 ? '#1c1917' : 'rgba(28, 25, 23, 0.1)', lineWidth: (ctx) => ctx.tick.value === 0 ? 4 : 2 }
                        } 
                    }
                }
            });
        }

        // ================= PROGRAM UTAMA =================
        function jalankanKalkulator() {
            resetSteps();
            document.getElementById('grafik-box').classList.add('hidden');
            let hasilContainer = document.getElementById('hasil-container');
            
            hasilContainer.classList.remove('animate-pop-in');
            void hasilContainer.offsetWidth; 
            hasilContainer.classList.add('animate-pop-in');

            if(myChart) myChart.destroy();

            let a1 = parseFloat(document.getElementById('a1').value) || 0;
            let b1 = parseFloat(document.getElementById('b1').value) || 0;
            let c1 = parseFloat(document.getElementById('c1').value) || 0;
            let a2 = parseFloat(document.getElementById('a2').value) || 0;
            let b2 = parseFloat(document.getElementById('b2').value) || 0;
            let c2 = parseFloat(document.getElementById('c2').value) || 0;
            
            let pilihan = document.querySelector('input[name="metode"]:checked').value;

            buatStep("0. PERSAMAAN DIKETAHUI", "bg-[#c4b5fd]", "text-stone-900");
            cetak_persamaan(format_angka(a1), format_angka(b1), format_angka(c1), 1);
            cetak_persamaan(format_angka(a2), format_angka(b2), format_angka(c2), 2);
            
            let D = a1 * b2 - a2 * b1;
            if (D === 0) {
                buatStep("KESIMPULAN", "bg-[#fca5a5]", "text-stone-900");
                out("Determinan = 0.");
                out("Kedua garis ini sejajar (tidak ada solusi) atau berimpit (solusi tak hingga).");
            } else {
                if (pilihan === '1') metode_substitusi(a1, b1, c1, a2, b2, c2);
                else if (pilihan === '2') metode_eliminasi(a1, b1, c1, a2, b2, c2);
                else if (pilihan === '3') metode_campuran(a1, b1, c1, a2, b2, c2);
                else if (pilihan === '4') metode_grafik(a1, b1, c1, a2, b2, c2);
            }

            renderSteps();
            hasilContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
